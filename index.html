
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Para mi flaquita hermosa ❤️</title>

    <style>
        body {
            margin: 0;
            padding: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(
                135deg, #17051d, #450b32, #150b28
            );
            font-family: Arial, sans-serif;
            color: white;
            text-align: center;
        }

        .contenedor {
            width: 85%;
            max-width: 600px;
            padding: 30px 20px;
            background: rgba(255,255,255,0.08);
            border: 1px solid #ff8fc8;
            border-radius: 25px;
            box-shadow: 0 0 30px #e83e9b55;
        }

        h1 {
            color: #ff9acb;
            font-size: 30px;
        }

        p {
            color: #ffd8eb;
            font-size: 18px;
        }

        button {
            background: #ff4f9a;
            color: white;
            border: none;
            padding: 16px 30px;
            border-radius: 30px;
            font-size: 18px;
            cursor: pointer;
            margin: 20px;
        }

        button:hover {
            background: #ff82b9;
            transform: scale(1.05);
        }

        video {
            width: 100%;
            border-radius: 15px;
            margin-top: 20px;
        }

        #reproductor {
            display: none;
        }

        .corazon {
            font-size: 45px;
            animation: latido 1s infinite;
        }

        @keyframes latido {
            50% {
                transform: scale(1.2);
            }
        }
    </style>
</head>

<body>

    <div class="contenedor">

        <div class="corazon">❤️</div>

        <h1>Para mi flaquita hermosa</h1>

        <p>
            Tengo algo muy especial para ti...
        </p>

        <button onclick="reproducirVideo()">
            ❤️ Presiona aquí, mi amor
        </button>

        <div id="reproductor">

            <video id="miVideo" controls playsinline>
                <source
                    src="video_compatible.mp4"
                    type="video/mp4">
                Tu navegador no puede reproducir este video.
            </video>

            <h2>Te amo mucho, mi flaquita hermosa ❤️</h2>

        </div>

    </div>

    <script>
        function reproducirVideo() {

            const reproductor =
                document.getElementById("reproductor");

            const video =
                document.getElementById("miVideo");

            reproductor.style.display = "block";

            video.play().catch(error => {
                console.log("No se pudo reproducir:", error);
            });
        }
    </script>

</body>
</html>
